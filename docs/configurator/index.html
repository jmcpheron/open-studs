<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>open-studs — configurator</title>
  <link rel="stylesheet" href="style.css?v=2">
  <link rel="icon" href="data:,">
  <!-- Import map so Three.js's addon modules can resolve "three" as a bare specifier -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="viewer"></canvas>

  <aside class="controls">
    <h1>open-studs</h1>

    <label>Preset
      <select id="preset"></select>
    </label>

    <div class="control-group">
      <span class="control-label">View</span>
      <div class="segmented" role="group" aria-label="View stage">
        <button type="button" class="active" data-view-stage="wrist">Wrist</button>
        <button type="button" data-view-stage="flat">Flat</button>
      </div>
    </div>

    <dl class="config-summary" aria-label="Selected bracelet configuration">
      <div>
        <dt>Band</dt>
        <dd id="summary-band"></dd>
      </div>
      <div>
        <dt>Surface</dt>
        <dd id="summary-surface"></dd>
      </div>
      <div>
        <dt>Latch</dt>
        <dd id="summary-latch"></dd>
      </div>
    </dl>

    <label>Base color
      <input type="color" id="color-base" value="#1a1a1a">
    </label>

    <label>Top color
      <input type="color" id="color-top" value="#cc1f1f">
    </label>

    <label>Swap at layer <span id="swap-layer-display" class="swap-display">7</span>
      <input type="range" id="swap-layer" min="0" max="15" value="7" step="1">
    </label>

    <p class="caption" id="preset-caption">Loading…</p>
    <p class="caption">
      <a href="../">← back to open-studs</a> ·
      <a href="https://github.com/jmcpheron/open-studs">source on github</a>
    </p>
  </aside>

  <script type="module" src="app.js?v=2"></script>
</body>
</html>
