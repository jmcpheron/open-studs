<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>open-studs — configurator</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:,">
  <!-- Import map so Three.js's addon modules can resolve "three" as a bare specifier -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="viewer"></canvas>

  <aside class="controls">
    <h1>open-studs</h1>
    <p class="tagline">
      Showcase: bracelet bent around a wrist, two-color layer-swap simulator.
      The colors map to a filament swap at a chosen print layer.
    </p>

    <label>Preset
      <select id="preset"></select>
    </label>

    <label>Base color
      <span class="hint">(bottom layers — touches the wrist)</span>
      <input type="color" id="color-base" value="#1a1a1a">
    </label>

    <label>Top color
      <span class="hint">(after the filament swap — what people see)</span>
      <input type="color" id="color-top" value="#cc1f1f">
    </label>

    <label>Swap at layer <span id="swap-layer-display" class="swap-display">7</span>
      <span class="hint">(0.2 mm layer height)</span>
      <input type="range" id="swap-layer" min="0" max="15" value="7" step="1">
    </label>

    <p class="caption" id="preset-caption">Loading…</p>
    <p class="caption">
      <a href="../">← back to open-studs</a> ·
      <a href="https://github.com/jmcpheron/open-studs">source on github</a>
    </p>
  </aside>

  <script type="module" src="app.js"></script>
</body>
</html>
