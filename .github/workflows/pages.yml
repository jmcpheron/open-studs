name: pages

# Builds docs/ with Jekyll and publishes to GitHub Pages on every push to
# main. After this lands the site is at https://jmcpheron.github.io/open-studs/.
#
# One-time user setup: Settings → Pages → Source → "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - ".github/workflows/pages.yml"
      - "_config.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage site
        # README.md becomes the landing page; docs/ tree gets nested under /docs/.
        run: |
          mkdir -p _src
          cp README.md _src/index.md
          cp -r docs _src/docs
          # carry over the supporting docs so they're linkable from the index
          for f in SHAREABLE-CAD.md CONTRIBUTING.md ACKNOWLEDGMENTS.md LICENSE; do
            [ -f "$f" ] && cp "$f" "_src/$f"
          done
          # Jekyll config: minimal theme, nice nav
          cat > _src/_config.yml <<'EOF'
          title: open-studs
          description: Parametric, 3D-printable studded bracelets in TPU
          theme: minima
          markdown: kramdown
          plugins:
            - jekyll-relative-links
          relative_links:
            enabled: true
            collections: true
          include:
            - README.md
          EOF
          ls -la _src/

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_src
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
