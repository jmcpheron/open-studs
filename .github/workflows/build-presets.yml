name: build-presets

# Renders presets/*.scad to docs/configurator/stls/*.stl on any change to
# the SCAD source tree. STL export is headless (no xvfb needed), so this is
# lighter than build-scad.yml's PNG rendering.
#
# Output path docs/configurator/stls/ is disjoint from build-scad's
# docs/assets/ — the two workflows can race without conflict.

on:
  push:
    branches: [main]
    paths:
      - "presets/**"
      - "bracelet.scad"
      - "core/**"
      - "studs/**"
      - "latches/**"
      - "patterns/**"
      - ".github/workflows/build-presets.yml"

concurrency:
  group: build-presets
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openscad
          openscad --version

      - name: Render presets to STL
        run: |
          mkdir -p docs/configurator/stls
          shopt -s nullglob
          for src in presets/*.scad; do
            name="$(basename "$src" .scad)"
            echo "Rendering $name…"
            openscad -o "docs/configurator/stls/${name}.stl" "$src"
          done
          ls -la docs/configurator/stls/

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/configurator/stls/
          if git diff --cached --quiet docs/configurator/stls/; then
            echo "No changes to preset STLs — nothing to commit."
            exit 0
          fi
          git commit -m "ci: regenerate preset STLs [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt; rebasing on origin/main."
            git pull --rebase origin main
          done
          echo "Failed to push after 5 attempts."
          exit 1
